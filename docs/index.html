<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本株 業種別資金流入ダッシュボード</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="viz-root">
  <header class="page-header">
    <h1>日本株 業種別資金流入ダッシュボード</h1>
    <p class="subtitle">
      東証上場の国内普通株式(プライム・スタンダード・グロース、REIT/ETFを除く)の株価・出来高から算出した「資金流入指数」(MFIベースの推定指標)を、
      33業種 → テーマ → サブテーマ → 個別銘柄までクリックでたどれます。
    </p>
    <p class="disclaimer">
      ※これは実際の売買代金データではなく、値動きと出来高から資金の勢いを推定した代用指標です。
      投資助言ではありません。最終更新: <span id="last-updated">--</span>
    </p>
  </header>

  <nav id="breadcrumb" class="breadcrumb" aria-label="パンくずリスト"></nav>

  <div id="toolbar" class="toolbar">
    <div id="period-control" class="period-control" role="group" aria-label="表示期間"></div>
    <div id="metric-control" class="metric-control" role="group" aria-label="表示指標" hidden></div>
  </div>

  <main id="chart-area"></main>

  <footer class="page-footer">
    <p>データソース: Yahoo!ファイナンス(株価) / 日本取引所グループ(業種分類)。テーマ分類はAIによる近似分類です。凡例をクリックすると個別に表示・非表示を切り替えられます。</p>
  </footer>

  <script src="vendor/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
