<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本株 業種別資金流入ダッシュボード</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="viz-root">
  <header class="page-header">
    <h1>日本株 業種別資金流入ダッシュボード</h1>
    <p class="subtitle">
      東証プライム市場銘柄の株価・出来高から算出した「資金流入指数」(MFIベースの推定指標)を、
      17業種 → 33業種 → テーマ → 個別銘柄までクリックでたどれます。
    </p>
    <p class="disclaimer">
      ※これは実際の売買代金データではなく、値動きと出来高から資金の勢いを推定した代用指標です。
      投資助言ではありません。最終更新: <span id="last-updated">--</span>
    </p>
  </header>

  <nav id="breadcrumb" class="breadcrumb" aria-label="パンくずリスト"></nav>

  <main>
    <section class="chart-card">
      <h2 id="chart-title-flow">資金流入指数</h2>
      <div class="chart-wrap">
        <canvas id="flow-chart" height="110"></canvas>
      </div>
      <div id="flow-legend" class="legend"></div>
    </section>

    <section id="price-card" class="chart-card" hidden>
      <h2>株価(終値)</h2>
      <div class="chart-wrap">
        <canvas id="price-chart" height="110"></canvas>
      </div>
    </section>

    <section class="children-card">
      <h2 id="children-title">内訳</h2>
      <div id="children-grid" class="children-grid"></div>
    </section>
  </main>

  <footer class="page-footer">
    <p>データソース: stooq.com(株価) / 日本取引所グループ(業種分類)。テーマ分類はAIによる近似分類です。</p>
  </footer>

  <script src="vendor/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
