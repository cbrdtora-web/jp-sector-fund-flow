name: 資金流入データの日次更新

on:
  schedule:
    # 平日 18:00 JST (= 09:00 UTC)。東証の取引終了・データ確定後を想定。
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 銘柄一覧を更新
        run: python scripts/fetch_universe.py

      - name: 業種・テーマ分類
        run: python scripts/classify_subthemes.py

      - name: 株価を差分取得
        run: python scripts/fetch_prices.py --mode update

      - name: 資金流入指数を計算
        run: python scripts/compute_mfi.py

      - name: サイト用データを生成
        run: python scripts/build_site_data.py

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe.csv data/prices docs
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "資金流入データを更新 ($(date -u +%Y-%m-%d))"
            # 更新処理の最中に他のコミットが入ってもpushが弾かれないよう、取り込んでから再試行する
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              sleep 10
            done
            exit 1
          fi
