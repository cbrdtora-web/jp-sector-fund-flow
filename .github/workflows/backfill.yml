name: 初回バックフィル(過去14年分の取得)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: 銘柄一覧を取得
        run: python scripts/fetch_universe.py

      - name: 業種・テーマ分類
        run: python scripts/classify_subthemes.py

      - name: 株価を14年分バックフィル(時間がかかります)
        run: python scripts/fetch_prices.py --mode backfill

      - name: 資金流入指数を計算
        run: python scripts/compute_mfi.py

      - name: サイト用データを生成
        run: python scripts/build_site_data.py

      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe.csv data/prices docs
          git commit -m "初回バックフィル: 過去14年分の資金流入データ" || echo "変更なし"
          git push
