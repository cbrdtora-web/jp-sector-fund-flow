name: 初回バックフィル(過去14年分の取得)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "動作確認用: 先頭N銘柄だけ処理する(空なら全銘柄)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: git設定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 銘柄一覧を取得
        run: python scripts/fetch_universe.py

      - name: 業種・テーマ分類
        run: python scripts/classify_subthemes.py

      - name: 株価を14年分バックフィル(時間がかかります・途中経過を随時コミット)
        run: python scripts/fetch_prices.py --mode backfill ${{ github.event.inputs.limit != '' && format('--limit {0}', github.event.inputs.limit) || '' }}
        env:
          GIT_CHECKPOINT_COMMIT: "1"

      - name: 資金流入指数を計算
        run: python scripts/compute_mfi.py

      - name: サイト用データを生成
        run: python scripts/build_site_data.py

      - name: 最終コミット
        run: |
          git add data/universe.csv data/prices docs
          git commit -m "初回バックフィル完了: サイト用データを生成" || echo "変更なし"
          git push
